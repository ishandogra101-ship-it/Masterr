<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterr — Command Ledger</title>
<meta name="description" content="A highly customizable command ledger for an MBA life: subjects, case competitions, mentorship, committees and admin — every deadline in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================= TOKENS */
:root{
  /* Light — "Confetti": bright, cool, playful */
  --bg:#F3F2FC; --bg2:#EAE8F8; --panel:#FFFFFF; --panel-2:#F1EFFB; --raise:#FFFFFF;
  --line:#E7E4F5; --line-strong:#D9D5EE;
  --ink:#241B36; --ink-2:#5C5478; --ink-dim:#8A83A6; --ink-faint:#B7B1CC;
  --p1:#7B5CFF; --p1-ink:#5B3EE0; --p1-wash:#ECE7FF;
  --c-violet:#7B5CFF; --c-pink:#FF4E8A; --c-coral:#FF7A4D; --c-amber:#FFB020; --c-lime:#2FCB6E; --c-sky:#2BA8FF;
  --good:#12B981; --good-ink:#0C8F62; --good-wash:#D7F7EB;
  --warn:#FF9F1C; --warn-ink:#B4650A; --warn-wash:#FFEBD0;
  --crit:#FF4D6D; --crit-ink:#D42A4C; --crit-wash:#FFE0E6;
  --shadow:0 1px 2px rgba(36,27,54,.05), 0 14px 30px -16px rgba(90,60,180,.22);
  --shadow-lift:0 6px 14px -6px rgba(90,60,180,.30), 0 26px 56px -22px rgba(90,60,180,.42);
  --r:14px; --r-lg:22px; --ease:cubic-bezier(.2,.85,.25,1);
  --display:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --serif:var(--display);
  --sans:"Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141126; --bg2:#0E0C1F; --panel:#1F1A38; --panel-2:#282253; --raise:#251F44;
    --line:#332C58; --line-strong:#463C77;
    --ink:#F3EFFF; --ink-2:#C8C1E8; --ink-dim:#948CBB; --ink-faint:#6B6497;
    --p1:#9B82FF; --p1-ink:#BBA8FF; --p1-wash:#2C2452;
    --c-violet:#9B82FF; --c-pink:#FF6FA3; --c-coral:#FF9166; --c-amber:#FFC24D; --c-lime:#3FD98A; --c-sky:#5CBEFF;
    --good:#37D99A; --good-ink:#7FEBC0; --good-wash:#123227;
    --warn:#FFB84D; --warn-ink:#FFD293; --warn-wash:#3A2A12;
    --crit:#FF6B85; --crit-ink:#FFA9B6; --crit-wash:#3A1A23;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -18px rgba(0,0,0,.7);
    --shadow-lift:0 8px 20px -8px rgba(0,0,0,.6), 0 30px 60px -24px rgba(0,0,0,.82);
  }
}
:root[data-theme="dark"]{
  --bg:#141126; --bg2:#0E0C1F; --panel:#1F1A38; --panel-2:#282253; --raise:#251F44;
  --line:#332C58; --line-strong:#463C77;
  --ink:#F3EFFF; --ink-2:#C8C1E8; --ink-dim:#948CBB; --ink-faint:#6B6497;
  --p1:#9B82FF; --p1-ink:#BBA8FF; --p1-wash:#2C2452;
  --c-violet:#9B82FF; --c-pink:#FF6FA3; --c-coral:#FF9166; --c-amber:#FFC24D; --c-lime:#3FD98A; --c-sky:#5CBEFF;
  --good:#37D99A; --good-ink:#7FEBC0; --good-wash:#123227;
  --warn:#FFB84D; --warn-ink:#FFD293; --warn-wash:#3A2A12;
  --crit:#FF6B85; --crit-ink:#FFA9B6; --crit-wash:#3A1A23;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -18px rgba(0,0,0,.7);
  --shadow-lift:0 8px 20px -8px rgba(0,0,0,.6), 0 30px 60px -24px rgba(0,0,0,.82);
}

/* ============================================================= KEYFRAMES */
@keyframes rise{from{opacity:0; transform:translateY(16px) scale(.97)} to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}
@keyframes slidein{from{transform:translateX(46px); opacity:.4} to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)}}

/* ============================================================= BASE */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
a{color:inherit}
svg{width:16px; height:16px}
::selection{background:var(--p1-wash); color:var(--p1-ink)}
:focus-visible{outline:2.5px solid var(--p1); outline-offset:2px; border-radius:6px}
input,textarea,select{background:var(--panel); border:1.6px solid var(--line-strong); color:var(--ink);
  border-radius:12px; padding:9px 12px; width:100%; transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--p1); box-shadow:0 0 0 4px var(--p1-wash)}
textarea{resize:vertical; min-height:72px; line-height:1.55}
label.fl{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-dim); margin:0 0 7px 2px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================= LAYOUT */
.app{display:grid; grid-template-columns:256px 1fr; height:100vh; overflow:hidden}
.spine{background:var(--panel); border-right:1.6px solid var(--line);
  display:flex; flex-direction:column; min-height:0}
.brand{padding:24px 22px 18px; border-bottom:1.6px solid var(--line)}
.brand h1{font-family:var(--display); font-weight:700; font-size:38px; line-height:.9; margin:0; letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--c-violet),var(--c-pink) 48%,var(--c-coral));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.brand .tag{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:9px}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:3px}
.nav .navlbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); padding:10px 12px 6px}
.navitem{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
  color:var(--ink-2); font-weight:600; font-size:14px; text-align:left; width:100%;
  transition:background .15s, color .15s, transform .12s}
.navitem svg{width:18px; height:18px; opacity:.9; flex:none}
.navitem .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
.navitem:hover{background:var(--panel-2); color:var(--ink); transform:translateX(3px)}
.navitem.on{background:var(--p1-wash); color:var(--p1-ink)}
.navitem.on svg{opacity:1; color:var(--p1-ink)}
.spine .cats{padding:4px 12px 12px; overflow-y:auto; flex:1; min-height:0}
.catrow{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px;
  width:100%; text-align:left; color:var(--ink-2); font-size:13.5px; font-weight:600; transition:background .13s, transform .12s}
.catrow:hover{background:var(--panel-2); color:var(--ink); transform:translateX(3px)}
.catrow.on{background:var(--panel-2); color:var(--ink)}
.swatch{width:11px; height:11px; border-radius:4px; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.05) inset}
.catrow .cnt{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
.spine .foot{padding:12px; border-top:1.6px solid var(--line); display:flex; gap:8px; align-items:center}

.main{display:flex; flex-direction:column; min-width:0; min-height:0}
.topbar{display:flex; align-items:center; gap:14px; padding:18px 28px; border-bottom:1.6px solid var(--line); background:var(--bg)}
.topbar .vtitle{font-family:var(--display); font-weight:600; font-size:30px; line-height:1; letter-spacing:-.01em}
.topbar .vsub{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:6px}
.search{position:relative; margin-left:auto; width:min(320px,34vw)}
.search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint)}
.search input{padding-left:38px; background:var(--panel); border-radius:999px}
.canvas{flex:1; overflow-y:auto; padding:28px; min-height:0}

/* entrance animation (only when a view first mounts) */
.canvas.anim .stat,.canvas.anim .dl,.canvas.anim .card,.canvas.anim .att,
.canvas.anim .panel,.canvas.anim .day,.canvas.anim .col{
  animation:rise .5s var(--ease) both; animation-delay:var(--d,0s)}

/* ============================================================= BUTTONS */
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 17px; border-radius:999px;
  font-weight:700; font-size:14px; border:1.8px solid var(--line-strong); background:var(--panel);
  color:var(--ink); transition:transform .13s var(--ease), box-shadow .15s, border-color .15s, background .15s}
.btn:hover{border-color:var(--p1); transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.96)}
.btn svg{width:16px; height:16px}
.btn.pri{background:var(--p1); border-color:transparent; color:#fff; box-shadow:0 8px 18px -6px var(--p1)}
.btn.pri:hover{box-shadow:0 12px 24px -6px var(--p1); transform:translateY(-3px)}
.btn.pri:active{transform:scale(.95)}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2); color:var(--ink); transform:none}
.btn.sm{padding:7px 13px; font-size:13px}
.iconbtn{width:38px; height:38px; display:grid; place-items:center; border-radius:12px;
  border:1.8px solid var(--line-strong); background:var(--panel); color:var(--ink-2);
  transition:transform .13s var(--ease), color .15s, border-color .15s}
.iconbtn:hover{color:var(--p1-ink); border-color:var(--p1); transform:translateY(-2px) rotate(-6deg)}
.iconbtn svg{width:18px; height:18px}

/* ============================================================= CHIPS */
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; font-weight:700;
  border:1.6px solid var(--line-strong); color:var(--ink-2); white-space:nowrap}
.pill .swatch{width:8px; height:8px}
.pill.due{color:var(--warn-ink); border-color:transparent; background:var(--warn-wash)}
.pill.over{color:var(--crit-ink); border-color:transparent; background:var(--crit-wash)}
.pill.done{color:var(--good-ink); border-color:transparent; background:var(--good-wash)}
.tag{display:inline-block; padding:3px 10px; border-radius:999px; background:var(--p1-wash);
  color:var(--p1-ink); font-size:11.5px; font-weight:700}
.prio{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:700}
.prio.p-Critical{color:var(--crit-ink)} .prio.p-High{color:var(--warn-ink)}
.prio.p-Medium{color:var(--ink-2)} .prio.p-Low{color:var(--ink-faint)}

/* ============================================================= OVERVIEW */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px}
.stat{background:var(--panel); border:1.8px solid var(--line); border-radius:var(--r-lg);
  padding:20px 20px 18px; position:relative; overflow:hidden;
  transition:transform .16s var(--ease), box-shadow .16s}
.stat::after{content:""; position:absolute; top:-34px; right:-34px; width:96px; height:96px; border-radius:50%;
  background:var(--p1); opacity:.12; transition:transform .3s var(--ease)}
.stat:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
.stat:hover::after{transform:scale(1.25)}
.stat.alert::after{background:var(--crit)} .stat.warn::after{background:var(--warn)} .stat.ok::after{background:var(--good)}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim)}
.stat .v{font-family:var(--display); font-weight:700; font-size:56px; line-height:.85; margin-top:14px; letter-spacing:-.02em; color:var(--p1)}
.stat .sub{font-size:12px; color:var(--ink-faint); margin-top:8px; position:relative}
.stat.alert .v{color:var(--crit)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--good)}
.ov-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:26px; align-items:start}
.sec-h{display:flex; align-items:baseline; gap:12px; margin:0 0 16px}
.sec-h h2{font-family:var(--display); font-weight:600; font-size:26px; margin:0; letter-spacing:-.01em}
.sec-h .meta{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint)}

.bucket{margin-bottom:22px}
.bucket .bh{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); display:flex; align-items:center; gap:10px; margin-bottom:10px; font-weight:700}
.bucket .bh .ln{flex:1; height:2px; border-radius:2px; background:var(--line)}
.bucket.overdue .bh{color:var(--crit-ink)}
.dl{display:flex; align-items:center; gap:13px; padding:12px 14px; border-radius:16px;
  border:1.8px solid var(--line); background:var(--panel); margin-bottom:9px; text-align:left; width:100%;
  transition:transform .15s var(--ease), border-color .15s, box-shadow .15s}
.dl:hover{border-color:var(--p1); box-shadow:var(--shadow); transform:translateX(5px)}
.dl .when{font-family:var(--mono); font-size:12px; width:66px; flex:none; color:var(--ink-2); text-align:right; font-weight:700}
.dl.over .when{color:var(--crit-ink)}
.dl .body{min-width:0; flex:1}
.dl .t{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dl .m{font-size:12px; color:var(--ink-dim); margin-top:3px; display:flex; align-items:center; gap:8px}
.dl .m .kind{color:var(--ink-faint)}
.dl.is-done .t{text-decoration:line-through; color:var(--ink-dim)}

.att{background:var(--panel); border:1.8px solid var(--line); border-radius:var(--r-lg); padding:6px}
.att .att-h{padding:16px 16px 10px; display:flex; align-items:center; gap:9px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); font-weight:700}
.att .att-h svg{color:var(--p1)}
.progwrap{padding:14px 16px 18px}
.prog-lbl{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim); margin-bottom:9px}
.prog-lbl b{color:var(--ink); font-weight:700}
.track{height:12px; border-radius:99px; background:var(--panel-2); overflow:hidden}
.track > i{display:block; height:100%; border-radius:99px; transition:width .6s var(--ease);
  background:linear-gradient(90deg,var(--c-violet),var(--c-pink))}
.catbars{display:flex; flex-direction:column; gap:12px; margin-top:18px}
.cb{display:grid; grid-template-columns:100px 1fr 42px; align-items:center; gap:10px}
.cb .nm{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:7px; font-weight:600}
.cb .mini{height:8px; border-radius:99px; background:var(--panel-2); overflow:hidden}
.cb .mini > i{display:block; height:100%; border-radius:99px; transition:width .6s var(--ease)}
.cb .n{font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:right; font-weight:700}

/* ============================================================= BOARD */
.boardbar{display:flex; align-items:center; gap:10px; margin-bottom:20px}
.seg{display:inline-flex; border:1.8px solid var(--line-strong); border-radius:999px; overflow:hidden; background:var(--panel)}
.seg button{padding:8px 15px; font-size:13px; font-weight:700; color:var(--ink-dim); transition:background .15s, color .15s}
.seg button.on{background:var(--p1); color:#fff}
.board{display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:14px}
.col{flex:0 0 306px; background:var(--panel-2); border:1.8px solid var(--line); border-radius:var(--r-lg);
  padding:14px; min-height:130px; transition:border-color .15s, box-shadow .15s}
.col.dragover{border-color:var(--p1); box-shadow:0 0 0 4px var(--p1-wash); transform:none}
.col .colh{display:flex; align-items:center; gap:9px; padding:4px 6px 14px}
.col .colh .swatch{width:11px; height:11px}
.col .colh .nm{font-weight:700; font-size:14px}
.col .colh .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint); font-weight:700}
.card{background:var(--raise); border:1.8px solid var(--line); border-radius:16px; padding:14px;
  margin-bottom:11px; cursor:grab; box-shadow:var(--shadow);
  transition:transform .16s var(--ease), box-shadow .16s, border-color .16s}
.card:hover{transform:translateY(-4px) rotate(-.7deg); box-shadow:var(--shadow-lift); border-color:var(--p1)}
.card.dragging{opacity:.4; transform:rotate(3deg) scale(.98)}
.card .ct{font-weight:700; font-size:14.5px; line-height:1.3}
.card.is-done .ct{text-decoration:line-through; color:var(--ink-dim)}
.card .cmeta{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; align-items:center}
.card .cfoot{display:flex; align-items:center; gap:11px; margin-top:12px; color:var(--ink-faint); font-size:11.5px; font-weight:600}
.card .cfoot .g{display:flex; align-items:center; gap:4px}
.card .cfoot svg{width:14px; height:14px}
.avstack{display:flex}
.av{width:22px; height:22px; border-radius:99px; display:grid; place-items:center; font-size:9px; font-weight:800;
  font-family:var(--mono); border:2px solid var(--panel); margin-left:-7px; color:#2a1330}
.av:first-child{margin-left:0}

/* ============================================================= LIST */
.tablewrap{border:1.8px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--panel)}
table{width:100%; border-collapse:collapse}
thead th{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-dim); text-align:left; padding:13px 15px; border-bottom:1.8px solid var(--line);
  cursor:pointer; user-select:none; white-space:nowrap; font-weight:700}
thead th:hover{color:var(--p1-ink)}
thead th .ar{color:var(--p1); margin-left:3px}
tbody td{padding:13px 15px; border-bottom:1.4px solid var(--line); font-size:14px; vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer; transition:background .12s}
tbody tr:hover{background:var(--panel-2)}
td .t{font-weight:700}
tr.is-done td .t{text-decoration:line-through; color:var(--ink-dim)}
.chk{width:21px; height:21px; border-radius:8px; border:2px solid var(--line-strong); display:grid;
  place-items:center; flex:none; transition:transform .12s, background .12s, border-color .12s}
.chk:hover{border-color:var(--good); transform:scale(1.08)}
.chk.on{background:var(--good); border-color:var(--good); animation:pop .35s var(--ease)}
.chk svg{width:13px; height:13px; color:#fff; opacity:0}
.chk.on svg{opacity:1}

/* ============================================================= CALENDAR */
.calhead{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.calhead .m{font-family:var(--display); font-weight:600; font-size:28px; letter-spacing:-.01em; min-width:220px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:9px}
.cal .dow{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-faint); text-align:center; padding-bottom:4px; font-weight:700}
.day{min-height:100px; border:1.8px solid var(--line); border-radius:14px; background:var(--panel);
  padding:9px; display:flex; flex-direction:column; gap:5px; text-align:left;
  transition:transform .14s var(--ease), border-color .14s, box-shadow .14s}
.day.pad{background:transparent; border-color:transparent}
.day:not(.pad){cursor:pointer}
.day:not(.pad):hover{border-color:var(--p1); transform:translateY(-3px); box-shadow:var(--shadow)}
.day.today{border-color:var(--p1); background:var(--p1-wash); box-shadow:0 0 0 1.5px var(--p1) inset}
.day .dn{font-family:var(--mono); font-size:12px; color:var(--ink-2); font-weight:700}
.day.today .dn{color:var(--p1-ink)}
.day .ev{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}
.day .ev .swatch{width:7px; height:7px; flex:none}
.day .ev.done{color:var(--ink-faint); text-decoration:line-through}
.day .more{font-family:var(--mono); font-size:10px; color:var(--ink-faint); font-weight:700}
.daydetail{margin-top:24px}

/* ============================================================= SETTINGS */
.settings{max-width:780px}
.panel{background:var(--panel); border:1.8px solid var(--line); border-radius:var(--r-lg); padding:22px 24px; margin-bottom:22px}
.panel h3{font-family:var(--display); font-weight:600; font-size:23px; margin:0 0 4px; letter-spacing:-.01em}
.panel .desc{font-size:13px; color:var(--ink-dim); margin:0 0 18px}
.editline{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1.4px solid var(--line)}
.editline:last-of-type{border-bottom:none}
.editline input[type=text]{max-width:240px}
.editline .grow{flex:1}
.editline input[type=color]{width:42px; height:38px; padding:2px; border-radius:10px; cursor:pointer}
.accents{display:flex; gap:11px; flex-wrap:wrap}
.accents button{width:38px; height:38px; border-radius:12px; border:3px solid transparent; transition:transform .13s var(--ease)}
.accents button:hover{transform:scale(1.12) rotate(-6deg)}
.accents button.on{border-color:var(--ink); transform:scale(1.1)}
.themeseg{margin-top:4px}

/* ============================================================= MODAL / DRAWER */
.scrim{position:fixed; inset:0; background:rgba(20,12,40,.5); backdrop-filter:blur(4px);
  display:flex; justify-content:flex-end; z-index:60; animation:fade .18s both}
.drawer{width:min(560px,100%); background:var(--bg); height:100%; overflow-y:auto;
  border-left:1.8px solid var(--line); box-shadow:var(--shadow-lift);
  animation:slidein .28s var(--ease) both}
.drawer .dh{position:sticky; top:0; background:var(--bg); z-index:2; display:flex; align-items:center; gap:12px;
  padding:20px 24px; border-bottom:1.8px solid var(--line)}
.drawer .dh .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:700}
.drawer .db{padding:24px}
.field{margin-bottom:18px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.title-input{font-family:var(--display); font-weight:600; font-size:27px; border:none; background:none; padding:6px 2px;
  border-bottom:2px solid var(--line); border-radius:0; letter-spacing:-.01em}
.title-input:focus{border-color:var(--p1); box-shadow:none}
.miniadd{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px;
  letter-spacing:.04em; text-transform:uppercase; color:var(--ink-dim); font-weight:700; padding:7px 2px; transition:color .13s}
.miniadd:hover{color:var(--p1-ink)}
.miniadd svg{width:15px; height:15px}
.subrow{display:flex; align-items:center; gap:9px; padding:9px; border:1.6px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--panel)}
.subrow input[type=text]{border:none; background:none; padding:2px 4px; box-shadow:none}
.subrow input.dt{max-width:150px; border:none; background:none; font-family:var(--mono); font-size:12px; color:var(--ink-dim); box-shadow:none}
.subrow .rm{color:var(--ink-faint); width:26px; height:26px; display:grid; place-items:center; border-radius:8px; flex:none; transition:.13s}
.subrow .rm:hover{color:var(--crit); background:var(--crit-wash)}
.subrow .chk{width:19px; height:19px}
.cf-row{display:grid; grid-template-columns:1fr 120px 1fr auto; gap:8px; align-items:center; margin-bottom:8px}
.cf-row input, .cf-row select{padding:8px 10px; font-size:13px}
.people-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px}
.people-row .rm{color:var(--ink-faint); width:26px; height:26px; display:grid; place-items:center; border-radius:8px; flex:none}
.people-row .rm:hover, .cf-row .rm:hover{color:var(--crit); background:var(--crit-wash)}
.cf-row .rm{color:var(--ink-faint); width:26px; height:26px; display:grid; place-items:center; border-radius:8px; flex:none}
.dfoot{position:sticky; bottom:0; background:var(--bg); border-top:1.8px solid var(--line); padding:16px 24px; display:flex; gap:10px; align-items:center}
.dfoot .del{margin-left:auto; color:var(--crit)}
.dfoot .del:hover{background:var(--crit-wash); border-color:var(--crit)}

/* ============================================================= MISC */
.empty{text-align:center; padding:74px 20px; color:var(--ink-dim)}
.empty .big{font-family:var(--display); font-weight:600; font-size:32px; color:var(--ink-2); margin-bottom:6px}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(24px);
  background:var(--p1); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:700;
  box-shadow:var(--shadow-lift); opacity:0; transition:.28s var(--ease); z-index:80; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:95}
.mobnav{display:none}
.hint{font-size:12px; color:var(--ink-faint); margin-top:8px}
select.statussel{max-width:200px}
details summary::-webkit-details-marker{display:none}

/* ============================================================= RESPONSIVE */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .spine{display:none}
  .mobnav{display:flex; gap:6px; overflow-x:auto; padding:10px 16px; border-bottom:1.6px solid var(--line); background:var(--panel)}
  .mobnav .navitem{width:auto; white-space:nowrap; padding:9px 13px}
  .ov-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .canvas{padding:18px}
  .topbar{padding:14px 18px}
  .search{width:auto; flex:1}
  .cf-row{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}

</style>

<body>
<div id="root"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   MASTERR — command ledger.  Vanilla JS, single file, localStorage.
   ===================================================================== */
(function(){
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k];
    else if(k.startsWith("on")&&typeof a[k]==="function")n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!=null&&a[k]!==false)n.setAttribute(k,a[k]); }
  for(const c of kids.flat()){ if(c==null||c===false)continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* -------- icons (inline, line-style) -------- */
const I={
 overview:'<path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/>',
 board:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="14" rx="1"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 6.6 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.6a1.6 1.6 0 0 0-1.5-1H1a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 3 6.6a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 8 3V2.5a2 2 0 0 1 4 0v.2A1.6 1.6 0 0 0 15 3.9a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
 chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 18l6-6-6-6"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
 flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V4"/>',
 dot:'<circle cx="12" cy="12" r="4"/>',
};
const svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round">${I[k]||''}</svg>`;
const icon=(k,w)=>{const s=document.createElement('span'); s.style.display='inline-flex'; s.innerHTML=svg(k,w); return s.firstChild;};

/* -------- date helpers -------- */
const MS=86400000;
function today(){const d=new Date(); d.setHours(0,0,0,0); return d;}
function parse(iso){ if(!iso)return null; const p=String(iso).split('-').map(Number); if(p.length<3)return null; const d=new Date(p[0],p[1]-1,p[2]); return isNaN(d)?null:d;}
function toISO(d){ if(!d)return ""; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(iso){ const p=parse(iso); if(!p)return null; return Math.round((p-today())/MS);}
function fmtShort(iso){ const p=parse(iso); return p?p.toLocaleDateString(undefined,{month:'short',day:'numeric'}):"";}
function relLabel(iso){ const d=daysUntil(iso); if(d==null)return "—";
  if(d<0)return Math.abs(d)+"d ago"; if(d===0)return "Today"; if(d===1)return "Tomorrow";
  const p=parse(iso); if(d<7)return p.toLocaleDateString(undefined,{weekday:'short'}); return fmtShort(iso);}
function bucketOf(d){ if(d<0)return"overdue"; if(d===0)return"today"; if(d===1)return"tomorrow";
  if(d<=7)return"week"; if(d<=14)return"next"; return"later";}
const BUCKETS=[["overdue","Overdue"],["today","Today"],["tomorrow","Tomorrow"],["week","This week"],["next","Next week"],["later","Later"]];

/* =====================================================================
   STATE
   ===================================================================== */
const KEY="masterr.v1";
const DEFAULT_STATUSES=[
  {id:"todo",name:"Not started",color:"#9A93B4",done:false},
  {id:"prog",name:"In progress",color:"#2BA8FF",done:false},
  {id:"block",name:"Blocked",color:"#FF4D6D",done:false},
  {id:"done",name:"Done",color:"#12B981",done:true},
];
const PRIOS=["Low","Medium","High","Critical"];
const CFTYPES=["text","number","date","url","select"];
let state, view="overview", catFilter="all", query="", boardGroup="status",
    sortKey="due", sortDir=1, calRef=today(), selDay=null, lastAnimView=null;

function seed(){
  const t=today(); const plus=n=>toISO(new Date(t.getTime()+n*MS));
  const cats=[
    {id:"acad",name:"Academics",color:"#2BA8FF"},
    {id:"case",name:"Case Comps",color:"#FF4E8A"},
    {id:"ment",name:"Mentorship",color:"#2FCB6E"},
    {id:"club",name:"Clubs & Committees",color:"#7B5CFF"},
    {id:"admin",name:"Admin",color:"#FF7A4D"},
    {id:"pers",name:"Personal",color:"#FFB020"},
  ];
  const mk=o=>Object.assign({id:uid(),statusId:"todo",priority:"Medium",notes:"",tags:[],
    people:[],subtasks:[],fields:[],createdAt:Date.now(),updatedAt:Date.now(),archived:false},o);
  const items=[
    mk({title:"Corporate Finance — Group Project",categoryId:"acad",statusId:"prog",priority:"High",due:plus(6),
      tags:["group","report"], notes:"Valuation of a listed FMCG firm. Deck + 15-page report.",
      people:[{name:"Aarav Mehta",role:"Modeling"},{name:"Sara Khan",role:"Research"},{name:"You",role:"Deck + submit"}],
      subtasks:[{id:uid(),title:"Build DCF model",done:true,due:plus(-1)},{id:uid(),title:"Draft report",done:false,due:plus(3)},{id:uid(),title:"Final deck & submit",done:false,due:plus(6)}],
      fields:[{id:uid(),label:"Professor",type:"text",value:"Prof. Rao"},{id:uid(),label:"Weightage",type:"text",value:"30%"}]}),
    mk({title:"Marketing Strategy — Quiz 2",categoryId:"acad",priority:"High",due:plus(2),tags:["quiz"],
      notes:"Chapters 4–7, STP & positioning.",fields:[{id:uid(),label:"Room",type:"text",value:"LH-3"}]}),
    mk({title:"Operations — Assignment 3",categoryId:"acad",statusId:"prog",due:plus(9),tags:["assignment"],
      notes:"Linear programming problem set."}),
    mk({title:"Deloitte Case Championship",categoryId:"case",statusId:"prog",priority:"Critical",due:plus(11),
      tags:["strategy","external"], notes:"National-level, ₹2L prize pool. Track: Go-to-market.",
      people:[{name:"You",role:"Lead"},{name:"Ishita Roy",role:"Finance"},{name:"Karan V.",role:"Design"}],
      subtasks:[{id:uid(),title:"Internal registration",done:true,due:plus(-3)},{id:uid(),title:"External registration",done:false,due:plus(1)},{id:uid(),title:"Round 1 submission",done:false,due:plus(7)},{id:uid(),title:"Assessment / jury call",done:false,due:plus(11)}],
      fields:[{id:uid(),label:"Team name",type:"text",value:"North Star"},{id:uid(),label:"Portal",type:"url",value:"https://unstop.com"},{id:uid(),label:"Prize",type:"text",value:"₹2,00,000"}]}),
    mk({title:"P&G CEO Challenge",categoryId:"case",priority:"High",due:plus(15),tags:["external"],
      notes:"Awaiting problem statement release.",
      people:[{name:"You",role:"—"},{name:"Neha S.",role:"—"}],
      subtasks:[{id:uid(),title:"Registration",done:false,due:plus(4)},{id:uid(),title:"First submission",done:false,due:plus(15)}]}),
    mk({title:"Mentor session — career roadmap",categoryId:"ment",priority:"Medium",due:plus(3),tags:["1:1"],
      notes:"Discuss summer internship targets & consulting vs product.",
      fields:[{id:uid(),label:"Mentor",type:"text",value:"Rohan Kapoor"},{id:uid(),label:"Mode",type:"text",value:"Zoom, 6 PM"}]}),
    mk({title:"Finance Club — speaker event logistics",categoryId:"club",statusId:"prog",due:plus(5),tags:["event"],
      notes:"Book auditorium, confirm speaker travel, promo.",
      subtasks:[{id:uid(),title:"Confirm venue",done:true},{id:uid(),title:"Design poster",done:false,due:plus(2)},{id:uid(),title:"Send invites",done:false,due:plus(4)}]}),
    mk({title:"Placement Committee — company outreach",categoryId:"club",priority:"High",due:plus(8),tags:["placement"],
      notes:"Email 12 target firms for final placements."}),
    mk({title:"Submit semester fee receipt",categoryId:"admin",priority:"High",due:plus(-1),tags:["urgent"],
      notes:"Upload paid receipt to the ERP portal."}),
    mk({title:"Update CV / Resume",categoryId:"pers",statusId:"prog",due:plus(5),tags:["career"],
      notes:"One-pager, consulting format.",
      subtasks:[{id:uid(),title:"Refresh bullet points",done:true},{id:uid(),title:"Review with senior",done:false,due:plus(3)},{id:uid(),title:"Finalize PDF",done:false,due:plus(5)}]}),
  ];
  return {version:1, updatedAt:Date.now(), meta:{title:"Masterr", subtitle:"Command Ledger"},
    categories:cats, statuses:DEFAULT_STATUSES.map(s=>({...s})), items,
    settings:{theme:"", accent:"", firstRun:true, firebase:null}};
}
function load(){ let s=null; try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.items)s=p;}}catch(e){}
  if(!s)s=seed();
  if(s.updatedAt==null)s.updatedAt=Date.now();
  if(!s.settings)s.settings={theme:"",accent:"",firstRun:false};
  if(s.settings.firebase===undefined)s.settings.firebase=null;
  return s; }
function persistLocal(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function save(){ state.updatedAt=Date.now(); persistLocal(); if(typeof Cloud!=="undefined")Cloud.pushSoon(); }
function catById(id){return state.categories.find(c=>c.id===id)||{name:"—",color:"#888"};}
function statusById(id){return state.statuses.find(s=>s.id===id)||state.statuses[0];}
function isDone(it){return statusById(it.statusId).done;}

/* =====================================================================
   THEME
   ===================================================================== */
const ACCENTS=[["Violet","#7B5CFF"],["Hot Pink","#FF4E8A"],["Tangerine","#FF7A4D"],
  ["Sunny","#FFB020"],["Mint","#2FCB6E"],["Sky","#2BA8FF"]];
function applyTheme(){
  const root=document.documentElement;
  if(state.settings.theme==="dark"||state.settings.theme==="light") root.setAttribute("data-theme",state.settings.theme);
  else root.removeAttribute("data-theme");
  const a=state.settings.accent;
  if(a){ root.style.setProperty("--p1",a);
    root.style.setProperty("--p1-wash", hexA(a,.15));
    root.style.setProperty("--p1-ink", a);
  } else { root.style.removeProperty("--p1"); root.style.removeProperty("--p1-wash"); root.style.removeProperty("--p1-ink"); }
}
function hexA(hex,al){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${al})`;}

/* =====================================================================
   RENDER — shell
   ===================================================================== */
const VIEWS=[["overview","Overview","Today at a glance"],["board","Board","Move & track"],
  ["calendar","Calendar","Month view"],["list","List","Everything, sorted"],["settings","Settings","Make it yours"]];

function render(){
  applyTheme();
  const root=$("#root"); root.innerHTML="";
  root.append(el("div",{class:"app"}, spine(), main()));
  if(state.settings.firstRun){ state.settings.firstRun=false; save(); }
  postRender();
}
function counts(){ const m={all:0}; state.categories.forEach(c=>m[c.id]=0);
  state.items.forEach(it=>{ if(it.archived)return; m.all++; if(m[it.categoryId]!=null)m[it.categoryId]++; }); return m; }

function spine(){
  const cn=counts();
  const nav=el("div",{class:"nav"},
    el("div",{class:"navlbl"},"Views"),
    ...VIEWS.map(([k,label])=>{
      const b=el("button",{class:"navitem"+(view===k?" on":""),onclick:()=>{view=k; selDay=null; render();}},
        icon(k), el("span",{},label));
      if(k!=="settings"&&k!=="calendar") b.append(el("span",{class:"cnt"},""));
      return b;
    })
  );
  const cats=el("div",{class:"cats"},
    el("div",{class:"navlbl",style:"padding-left:12px"},"Categories"),
    el("button",{class:"catrow"+(catFilter==="all"?" on":""),onclick:()=>{catFilter="all"; render();}},
      el("span",{class:"swatch",style:"background:var(--ink-faint)"}), el("span",{},"All"),
      el("span",{class:"cnt"},String(cn.all))),
    ...state.categories.map(c=>el("button",{class:"catrow"+(catFilter===c.id?" on":""),onclick:()=>{catFilter=c.id; render();}},
      el("span",{class:"swatch",style:"background:"+c.color}), el("span",{style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},c.name),
      el("span",{class:"cnt"},String(cn[c.id]||0))))
  );
  const foot=el("div",{class:"foot"},
    el("button",{class:"iconbtn",title:"Toggle light / dark",onclick:toggleTheme},
      icon(document.documentElement.getAttribute("data-theme")==="dark"||(matchMedia("(prefers-color-scheme:dark)").matches&&document.documentElement.getAttribute("data-theme")!=="light")?"sun":"moon")),
    el("button",{id:"cloudfoot",title:"Cloud sync — open Settings",onclick:()=>{view="settings";render();},
      style:"display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase"},
      el("span",{class:"d",style:"width:7px;height:7px;border-radius:99px;flex:none;background:"+cloudColor()}),
      el("span",{class:"t"},cloudLabel()))
  );
  return el("aside",{class:"spine"},
    el("div",{class:"brand"},
      el("h1",{html:'Masterr<span class="dot">.</span>'}),
      el("div",{class:"tag"},state.meta.subtitle||"Command Ledger")),
    nav, cats, foot);
}

function main(){
  const cur=VIEWS.find(v=>v[0]===view)||VIEWS[0];
  const mob=el("div",{class:"mobnav"},
    ...VIEWS.map(([k,label])=>el("button",{class:"navitem"+(view===k?" on":""),onclick:()=>{view=k;selDay=null;render();}}, icon(k), el("span",{},label))));
  const top=el("div",{class:"topbar"},
    el("div",{}, el("div",{class:"vtitle"},cur[1]), el("div",{class:"vsub"},cur[2])),

function rerenderCanvas(){ const c=$("#canvas"); if(!c)return; c.innerHTML=""; c.append(viewBody()); postRender(); }

/* ---- motion: entrance stagger, count-up, confetti ---- */
function reducedMotion(){ try{return matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(_){return false;} }
function postRender(){ const c=$("#canvas"); if(!c)return;
  const fresh = view!==lastAnimView; lastAnimView=view;
  if(fresh && !reducedMotion()){
    let i=0; c.querySelectorAll(".stat,.dl,.card,.att,.panel,.day,.col").forEach(n=>{
      n.style.setProperty("--d",(Math.min(i,18)*0.035)+"s"); i++; });
    c.classList.add("anim"); void c.offsetWidth; animateCounts(c);
  } else { c.classList.remove("anim"); }
}
function animateCounts(scope){ if(reducedMotion())return;
  scope.querySelectorAll("[data-count]").forEach(n=>{ const target=+n.getAttribute("data-count")||0;
    if(target<=0){ n.textContent="0"; return; } const dur=750, t0=performance.now();
    (function tick(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
      n.textContent=Math.round(target*e); if(p<1)requestAnimationFrame(tick); })(t0);
  }); }
function confetti(x,y){ if(reducedMotion())return;
  const W=innerWidth, H=innerHeight, dpr=Math.min(2,devicePixelRatio||1);
  const cv=document.createElement("canvas"); cv.className="confetti";
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  document.body.append(cv); const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=(x==null?W/2:x), cy=(y==null?H/3:y);
  const cols=["#7B5CFF","#FF4E8A","#FF7A4D","#FFB020","#2FCB6E","#2BA8FF","#EC6ADF"];
  const P=[]; for(let i=0;i<110;i++){ const a=Math.random()*Math.PI*2, sp=4+Math.random()*8;
    P.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,g:.18+Math.random()*.12,
      s:5+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*.5,
      c:cols[i%cols.length],life:1,sq:Math.random()>.5}); }
  let t0=performance.now();
  (function frame(t){ t0=t; ctx.clearRect(0,0,W,H); let alive=false;
    for(const p of P){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=.011;
      if(p.life>0 && p.y<H+30){ alive=true; ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
        ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
        if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);
        else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.28);ctx.fill();} ctx.restore(); } }
    if(alive)requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* -------- filtering -------- */
function visibleItems(){
  const q=query.trim().toLowerCase();
  return state.items.filter(it=>{
    if(it.archived)return false;
    if(catFilter!=="all"&&it.categoryId!==catFilter)return false;
    if(q){ const hay=[it.title,(it.tags||[]).join(" "),(it.people||[]).map(p=>p.name).join(" "),it.notes,
      (it.fields||[]).map(f=>f.label+" "+f.value).join(" ")].join(" ").toLowerCase();
      if(!hay.includes(q))return false; }
    return true;
  });
}
/* all deadlines flattened: item due + subtask dues */
function deadlines(items){
  const out=[];
  items.forEach(it=>{
    if(it.due) out.push({iso:it.due, itemId:it.id, title:it.title, kind:"Due", done:isDone(it), catId:it.categoryId});
    (it.subtasks||[]).forEach(s=>{ if(s.due) out.push({iso:s.due, itemId:it.id, title:it.title, kind:s.title, done:s.done||isDone(it), catId:it.categoryId}); });
  });
  out.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
  return out;
}

function overviewView(){

  const wrap=el("div",{});

    stat(overdue, "Overdue", overdue>0?"alert":"", overdue>0?"needs attention now":"all clear"),

            el("span",{}, c.name), d.kind!=="Due"?el("span",{class:"kind"},"· "+d.kind):null)),

    el("div",{class:"progwrap"},

        el("b",{class:"mono"}, pct+"%")),
      el("div",{class:"track"}, el("i",{style:"width:"+pct+"%"})),
      el("div",{class:"catbars"}, ...state.categories.map(c=>{
        const its=state.items.filter(i=>!i.archived&&i.categoryId===c.id);
        const dn=its.filter(isDone).length; const p=its.length?Math.round(dn/its.length*100):0;
        return el("div",{class:"cb"},
          el("div",{class:"nm"}, el("span",{class:"swatch",style:"background:"+c.color}), c.name),
          el("div",{class:"mini"}, el("i",{style:"width:"+p+"%;background:"+c.color})),

function stat(v,k,cls,sub){ return el("div",{class:"stat "+(cls||"")},

function teammateRoundup(items){

        const fallback=state.categories.find(x=>x.id!==c.id).id;
        state.items.forEach(it=>{ if(it.categoryId===c.id)it.categoryId=fallback; });
        state.categories=state.categories.filter(x=>x.id!==c.id);
        if(catFilter===c.id)catFilter="all"; save(); render();
      }}, icon("trash",1.9))));
  });
  catPanel.append(el("button",{class:"miniadd",onclick:()=>{
    state.categories.push({id:uid(),name:"New category",color:AVCOL[state.categories.length%AVCOL.length]}); save(); render();
  }}, icon("plus"), "Add category"));
  wrap.append(catPanel);

  /* statuses */
  const stPanel=el("div",{class:"panel"},
    el("h3",{},"Statuses"),
    el("p",{class:"desc"},"The columns on your board. Mark which ones count as complete."));
  state.statuses.forEach(s=>{
    stPanel.append(el("div",{class:"editline"},
      el("input",{type:"color",value:s.color,oninput:e=>{s.color=e.target.value; save();}}),
      el("input",{type:"text",class:"grow",value:s.name,oninput:e=>{s.name=e.target.value; save();}}),
      el("label",{style:"display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;width:auto"},
        el("input",{type:"checkbox",style:"width:auto",checked:s.done?"checked":null,onchange:e=>{s.done=e.target.checked; save(); }}),
        "= complete"),
      el("button",{class:"iconbtn",title:"Delete status",onclick:()=>{
        if(state.statuses.length<=1){toast("Keep at least one status");return;}
        const fallback=state.statuses.find(x=>x.id!==s.id).id;
        state.items.forEach(it=>{ if(it.statusId===s.id)it.statusId=fallback; });
        state.statuses=state.statuses.filter(x=>x.id!==s.id); save(); render();
      }}, icon("trash",1.9))));
  });
  stPanel.append(el("button",{class:"miniadd",onclick:()=>{
    state.statuses.push({id:uid(),name:"New status",color:"#8A8D99",done:false}); save(); render();
  }}, icon("plus"), "Add status"));
  wrap.append(stPanel);

  /* cloud sync */
  wrap.append(cloudPanel());

  /* data */
  wrap.append(el("div",{class:"panel"},
    el("h3",{},"Your data"),
    el("p",{class:"desc"},"Everything lives in this browser. Export a backup, import it on another device, or start fresh."),
    el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
      el("button",{class:"btn",onclick:exportData}, icon("download"), "Export JSON"),
      el("button",{class:"btn",onclick:importData}, icon("upload"), "Import JSON"),
      el("button",{class:"btn",onclick:()=>{ if(confirm("Reset to the sample data? Your current tasks will be replaced."))
        {state=seed(); save(); catFilter="all"; render(); toast("Reset to sample");} }}, "Load sample"),
      el("button",{class:"btn",style:"color:var(--crit)",onclick:()=>{ if(confirm("Delete ALL tasks and start empty?"))
        {state=seed(); state.items=[]; save(); catFilter="all"; render(); toast("Cleared");} }}, icon("trash"), "Clear all")
    ),
    el("div",{class:"hint"},"Tip: download this page (index.html) and open it from your own device — your data stays on that machine.")
  ));
  return wrap;
}

/* =====================================================================
   EDITOR (drawer)
   ===================================================================== */
function openEditor(id){
  const editing = id? state.items.find(i=>i.id===id) : null;
  const it = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:uid(), title:"", categoryId:state.categories[0]&&state.categories[0].id, statusId:state.statuses[0].id,
    priority:"Medium", due:"", notes:"", tags:[], people:[], subtasks:[], fields:[],
    createdAt:Date.now(), updatedAt:Date.now(), archived:false };

  const m=$("#modal"); m.innerHTML="";
  const close=()=>{ m.innerHTML=""; };

  const titleInput=el("input",{class:"title-input",type:"text",placeholder:"Task title…",value:it.title});
  const catSel=el("select",{}, ...state.categories.map(c=>el("option",{value:c.id,selected:c.id===it.categoryId?"selected":null},c.name)));
  const stSel=el("select",{}, ...state.statuses.map(s=>el("option",{value:s.id,selected:s.id===it.statusId?"selected":null},s.name)));
  const prSel=el("select",{}, ...PRIOS.map(p=>el("option",{value:p,selected:p===it.priority?"selected":null},p)));
  const dueInput=el("input",{type:"date",value:it.due||""});
  const notesInput=el("textarea",{placeholder:"Notes, links, context…"}); notesInput.value=it.notes||"";
  const tagsInput=el("input",{type:"text",placeholder:"comma, separated, tags",value:(it.tags||[]).join(", ")});

  /* subtasks */
  const subWrap=el("div",{});
  const addSub=(s)=>{ const row=el("div",{class:"subrow"});
    const cb=checkbox(!!s.done,()=>{ s.done=!s.done; cb.classList.toggle("on"); });
    const ti=el("input",{type:"text",placeholder:"Sub-task / deadline…",value:s.title||""});
    ti.addEventListener("input",e=>s.title=e.target.value);
    const dt=el("input",{class:"dt",type:"date",value:s.due||"",title:"Optional due date"});
    dt.addEventListener("input",e=>s.due=e.target.value);
    const rm=el("button",{class:"rm",title:"Remove",onclick:()=>{ it.subtasks=it.subtasks.filter(x=>x!==s); row.remove(); }});
    rm.innerHTML=svg("x",2);
    row.append(cb,ti,dt,rm); subWrap.append(row);
  };
  (it.subtasks||[]).forEach(addSub);

  /* people */
  const pplWrap=el("div",{});
  const addPpl=(p)=>{ const row=el("div",{class:"people-row"});
    const nm=el("input",{type:"text",placeholder:"Teammate / person",value:p.name||""});
    nm.addEventListener("input",e=>p.name=e.target.value);
    const rl=el("input",{type:"text",placeholder:"Role (optional)",value:p.role||""});
    rl.addEventListener("input",e=>p.role=e.target.value);
    const rm=el("button",{class:"rm",title:"Remove",onclick:()=>{ it.people=it.people.filter(x=>x!==p); row.remove(); }});
    rm.innerHTML=svg("x",2);
    row.append(nm,rl,rm); pplWrap.append(row);
  };
  (it.people||[]).forEach(addPpl);

  /* custom fields */
  const cfWrap=el("div",{});
  const addCF=(f)=>{ const row=el("div",{class:"cf-row"});
    const lb=el("input",{type:"text",placeholder:"Field name",value:f.label||""});
    lb.addEventListener("input",e=>f.label=e.target.value);
    const ty=el("select",{}, ...CFTYPES.map(t=>el("option",{value:t,selected:t===f.type?"selected":null},t)));
    let valInput=cfValInput(f);
    ty.addEventListener("change",e=>{ f.type=e.target.value; const nv=cfValInput(f); row.replaceChild(nv,valInput); valInput=nv; });
    const rm=el("button",{class:"rm",title:"Remove",onclick:()=>{ it.fields=it.fields.filter(x=>x!==f); row.remove(); }});
    rm.innerHTML=svg("x",2);
    row.append(lb,ty,valInput,rm); cfWrap.append(row);
  };
  function cfValInput(f){ if(f.type==="select"){
      const i=el("input",{type:"text",placeholder:"value; or opt1, opt2…",value:f.value||""});
      i.addEventListener("input",e=>f.value=e.target.value); return i; }
    const map={number:"number",date:"date",url:"url"};
    const i=el("input",{type:map[f.type]||"text",placeholder:f.type==="url"?"https://…":"value",value:f.value||""});
    i.addEventListener("input",e=>f.value=e.target.value); return i; }
  (it.fields||[]).forEach(addCF);

  const body=el("div",{class:"db"},
    el("div",{class:"field"}, titleInput),
    el("div",{class:"row3"},
      el("div",{}, el("label",{class:"fl"},"Category"), catSel),
      el("div",{}, el("label",{class:"fl"},"Status"), stSel),
      el("div",{}, el("label",{class:"fl"},"Priority"), prSel)),
    el("div",{class:"field",style:"margin-top:14px"},
      el("div",{class:"row2"},
        el("div",{}, el("label",{class:"fl"},"Due date"), dueInput),
        el("div",{}, el("label",{class:"fl"},"Tags"), tagsInput))),
    el("div",{class:"field"}, el("label",{class:"fl"},"Notes"), notesInput),

    el("div",{class:"field"}, el("label",{class:"fl"},"Sub-tasks & staged deadlines"),
      subWrap, el("button",{class:"miniadd",onclick:()=>{ const s={id:uid(),title:"",done:false,due:""}; it.subtasks.push(s); addSub(s); }}, icon("plus"),"Add sub-task")),

    el("div",{class:"field"}, el("label",{class:"fl"},"Team & people"),
      pplWrap, el("button",{class:"miniadd",onclick:()=>{ const p={name:"",role:""}; it.people.push(p); addPpl(p); }}, icon("plus"),"Add person")),

    el("div",{class:"field"}, el("label",{class:"fl"},"Custom fields — add anything"),
      cfWrap, el("button",{class:"miniadd",onclick:()=>{ const f={id:uid(),label:"",type:"text",value:""}; it.fields.push(f); addCF(f); }}, icon("plus"),"Add field"))
  );

  const saveIt=()=>{
    it.title=titleInput.value.trim()||"Untitled";
    it.categoryId=catSel.value; it.statusId=stSel.value; it.priority=prSel.value;
    it.due=dueInput.value; it.notes=notesInput.value;
    it.tags=tagsInput.value.split(",").map(s=>s.trim()).filter(Boolean);
    it.subtasks=(it.subtasks||[]).filter(s=>s.title.trim());
    it.people=(it.people||[]).filter(p=>p.name.trim());
    it.fields=(it.fields||[]).filter(f=>f.label.trim());
    it.updatedAt=Date.now();
    if(editing){ const i=state.items.findIndex(x=>x.id===editing.id); state.items[i]=it; }
    else state.items.push(it);
    save(); close(); render(); toast(editing?"Saved":"Task added");
  };

  const foot=el("div",{class:"dfoot"},
    el("button",{class:"btn pri",onclick:saveIt}, icon("check"), editing?"Save changes":"Add task"),
    el("button",{class:"btn ghost",onclick:close},"Cancel"),
    editing?el("button",{class:"btn ghost del",onclick:()=>{ if(confirm("Delete this task?"))
      { state.items=state.items.filter(x=>x.id!==editing.id); save(); close(); render(); toast("Deleted"); } }}, icon("trash"),"Delete"):null
  );

  const drawer=el("div",{class:"drawer"},
    el("div",{class:"dh"},
      el("div",{}, el("div",{class:"eyebrow"}, editing?"Editing task":"New task"),
        el("div",{style:"font-family:var(--serif);font-size:20px"}, editing?"Details":"Add to ledger")),
      el("button",{class:"iconbtn",style:"margin-left:auto",onclick:close}, icon("x"))),
    body, foot);
  const scrim=el("div",{class:"scrim",onclick:e=>{ if(e.target===scrim)close(); }}, drawer);
  m.append(scrim);
  setTimeout(()=>titleInput.focus(),60);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function toggleDone(it,ev){
  const was=isDone(it); const doneStatus=state.statuses.find(s=>s.done);
  if(was){ const open=state.statuses.find(s=>!s.done); it.statusId=open?open.id:it.statusId; }
  else if(doneStatus){ it.statusId=doneStatus.id; }
  it.updatedAt=Date.now(); save(); rerenderCanvas();
  if(!was && isDone(it)) confetti(ev&&ev.clientX, ev&&ev.clientY);
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark"
    || (matchMedia("(prefers-color-scheme:dark)").matches && document.documentElement.getAttribute("data-theme")!=="light");
  state.settings.theme = isDark ? "light" : "dark"; save(); render();
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900); }
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=el("a",{href:url,download:"masterr-backup-"+toISO(today())+".json"});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
}
function importData(){
  const inp=el("input",{type:"file",accept:"application/json,.json"});
  inp.addEventListener("change",()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result);
      if(!s||!Array.isArray(s.items))throw 0;
      state=Object.assign(seed(),s); catFilter="all"; save(); render(); toast("Imported "+s.items.length+" tasks");
    }catch(e){ toast("Couldn't read that file"); } };
    r.readAsText(f); });
  inp.click();
}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ const m=$("#modal"); if(m.innerHTML){m.innerHTML=""; return;} }
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); openEditor(); }
  if(e.key==="/"){ e.preventDefault(); const s=$(".search input"); s&&s.focus(); }
});

/* =====================================================================
   CLOUD SYNC — optional Firebase / Firestore (bring your own project)
   ===================================================================== */
const FBV="10.12.5";
function timeAgo(ts){ const s=Math.round((Date.now()-ts)/1000); if(s<45)return"just now";
  const m=Math.round(s/60); if(m<60)return m+"m ago"; const h=Math.round(m/60); if(h<24)return h+"h ago";
  return Math.round(h/24)+"d ago"; }
function cloudLabel(){ return ({off:"Saved locally", connecting:"Connecting…", signedout:"Cloud · sign in",
  live:"Cloud synced", error:"Cloud error"})[Cloud.status]||"Saved locally"; }
function cloudColor(){ return ({off:"var(--ink-faint)", connecting:"var(--accent)", signedout:"var(--accent)",
  live:"var(--good)", error:"var(--crit)"})[Cloud.status]||"var(--ink-faint)"; }
let _prevCloud="";
function updateCloudUI(){
  const f=document.getElementById("cloudfoot");
  if(f){ const t=f.querySelector(".t"), d=f.querySelector(".d");
    if(t)t.textContent=cloudLabel(); if(d)d.style.background=cloudColor(); }
  if(view==="settings" && Cloud.status!==_prevCloud) rerenderCanvas();
  _prevCloud=Cloud.status;
}
function applyRemote(obj){
  const fb = state.settings && state.settings.firebase;           /* keep this device's creds */
  state = obj;
  if(!state.settings) state.settings={};
  state.settings.firebase = fb;
  persistLocal(); render();
}
function parseCfg(text){ try{ const t=String(text).trim(); const s=t.indexOf("{"), e=t.lastIndexOf("}");
  if(s<0||e<0)return null; const obj=Function("return ("+t.slice(s,e+1)+")")();
  if(obj&&obj.apiKey&&obj.projectId)return obj; return null; }catch(_){ return null; } }

const Cloud={
  status:"off", msg:"", app:null, auth:null, db:null, user:null, mods:null,
  unsub:null, pushTimer:null, applying:false,
  set(s,m){ this.status=s; this.msg=m||""; updateCloudUI(); },
  cfg(){ return state.settings.firebase && state.settings.firebase.config; },
  async connect(){
    const config=this.cfg(); if(!config){ this.set("off"); return; }
    try{
      this.set("connecting","Loading Firebase…");
      if(!this.mods){
        const [a,au,fs]=await Promise.all([
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
        ]);
        this.mods={a,au,fs};
      }
      const {a,au,fs}=this.mods;
      this.app=(a.getApps&&a.getApps().length)? a.getApp() : a.initializeApp(config);
      this.auth=au.getAuth(this.app);
      this.db=fs.getFirestore(this.app);
      au.onAuthStateChanged(this.auth, u=>{
        this.user=u;
        if(u){ this.set("live","Signed in"); this.subscribe(); }
        else { if(this.unsub){this.unsub(); this.unsub=null;} this.set("signedout","Not signed in"); }
      });
    }catch(e){ this.set("error","Couldn't load Firebase — "+(e&&e.message||e)); }
  },
  async signInGoogle(){ try{ const {au}=this.mods; await au.signInWithPopup(this.auth, new au.GoogleAuthProvider()); }
    catch(e){ this.set("error", (e&&e.message||String(e))); toast("Google sign-in failed"); } },
  async signInAnon(){ try{ const {au}=this.mods; await au.signInAnonymously(this.auth); }
    catch(e){ this.set("error", (e&&e.message||String(e))); toast("Anonymous sign-in failed"); } },
  async signOut(){ try{ const {au}=this.mods; if(this.auth)await au.signOut(this.auth); }catch(e){} },
  ref(){ const {fs}=this.mods; return fs.doc(this.db,"masterr",this.user.uid); },
  subscribe(){ const {fs}=this.mods; if(this.unsub)this.unsub();
    this.unsub=fs.onSnapshot(this.ref(), snap=>{
      if(snap.metadata.hasPendingWrites) return;                  /* our own optimistic write */
      if(!snap.exists()){ this.pushNow(); return; }               /* seed the cloud from local */
      const d=snap.data(); if(!d||!d.blob) return;
      let obj; try{ obj=JSON.parse(d.blob); }catch(_){ return; }
      const ru=obj.updatedAt||0, lu=state.updatedAt||0;
      if(ru>lu){ this.applying=true; applyRemote(obj); this.applying=false; this.set("live","Synced "+timeAgo(ru)); }
      else if(ru<lu){ this.pushNow(); }                            /* local newer → update cloud */
    }, err=>{ this.set("error", err&&err.message||"Sync error"); });
  },
  pushSoon(){ if(this.status!=="live"||this.applying) return;
    clearTimeout(this.pushTimer); this.pushTimer=setTimeout(()=>this.pushNow(),1200); },
  async pushNow(){ if(this.status!=="live"||!this.user) return;
    try{ const {fs}=this.mods; const clone=JSON.parse(JSON.stringify(state));
      if(clone.settings) delete clone.settings.firebase;          /* never store creds in Firestore */
      await fs.setDoc(this.ref(), {blob:JSON.stringify(clone), updatedAt:state.updatedAt||Date.now()});
      this.set("live","Synced "+timeAgo(Date.now())); }
    catch(e){ this.set("error", e&&e.message||"Write failed"); } },
  async disconnect(){ if(this.unsub){this.unsub();this.unsub=null;} await this.signOut(); this.user=null;
    if(state.settings.firebase) state.settings.firebase.autoconnect=false; persistLocal(); this.set("off"); },
  forget(){ this.disconnect(); state.settings.firebase=null; persistLocal(); rerenderCanvas(); }
};

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /masterr/{uid} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
  }
}`;
function cloudPanel(){
  const fb=state.settings.firebase, st=Cloud.status;
  const p=el("div",{class:"panel"},
    el("h3",{},"Cloud sync — Firebase"),
    el("p",{class:"desc"},"Optional. Connect your own Firebase project to sync this ledger across devices in real time. Your config stays on this device; your tasks live in your Firestore."));
  /* status line */
  p.append(el("div",{style:"display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-bottom:16px"},
    el("span",{style:"width:8px;height:8px;border-radius:99px;flex:none;background:"+cloudColor()}),
    el("span",{style:"font-weight:600;font-size:13.5px"}, cloudLabel()),
    Cloud.user?el("span",{style:"font-family:var(--mono);font-size:11px;color:var(--ink-dim)"},
      "· "+(Cloud.user.email||("anon "+Cloud.user.uid.slice(0,6)))):null,
    Cloud.msg?el("span",{style:"margin-left:auto;font-size:11.5px;color:"+(st==="error"?"var(--crit)":"var(--ink-dim)")+";max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap",title:Cloud.msg},Cloud.msg):null));

  if(!fb || !fb.config){
    const ta=el("textarea",{placeholder:'Paste your firebaseConfig here — e.g.\n{\n  "apiKey": "…",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app",\n  …\n}',style:"min-height:130px;font-family:var(--mono);font-size:12px"});
    p.append(el("label",{class:"fl"},"Firebase config"), ta,
      el("div",{class:"hint"},"Firebase console → Project settings → Your apps → SDK setup & config → Config."),
      el("button",{class:"btn pri",style:"margin-top:12px",onclick:()=>{
        const c=parseCfg(ta.value); if(!c){ toast("Couldn't read that config"); return; }
        state.settings.firebase={config:c, autoconnect:true}; persistLocal(); Cloud.connect(); rerenderCanvas();
      }}, icon("upload"), "Connect project"));
  } else if(st==="live" && Cloud.user){
    p.append(el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
      el("button",{class:"btn",onclick:()=>Cloud.signOut()}, "Sign out"),
      el("button",{class:"btn",onclick:()=>Cloud.disconnect().then(rerenderCanvas)}, "Stop syncing"),
      el("button",{class:"btn",style:"color:var(--crit)",onclick:()=>{ if(confirm("Forget the Firebase config on this device? Your cloud data is not deleted.")) Cloud.forget(); }}, "Forget config")));
  } else {
    p.append(el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
      el("button",{class:"btn pri",onclick:()=>Cloud.signInGoogle()}, "Sign in with Google"),
      el("button",{class:"btn",onclick:()=>Cloud.signInAnon()}, "Use anonymously"),
      (st==="off"||st==="error")?el("button",{class:"btn",onclick:()=>Cloud.connect()}, "Reconnect"):null,
      el("button",{class:"btn ghost",style:"color:var(--crit)",onclick:()=>{ if(confirm("Forget the Firebase config on this device?")) Cloud.forget(); }}, "Forget config")));
  }
  /* setup help */
  const det=el("details",{style:"margin-top:16px"});
  det.append(el("summary",{style:"cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)"},"First-time setup & security rules"));
  det.append(el("ol",{style:"margin:12px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.7"},
    el("li",{},"In the Firebase console, create a project and a Web app; copy its config into the box above."),
    el("li",{},"Build → Firestore Database → create (production mode)."),
    el("li",{},"Build → Authentication → Sign-in method → enable Google and/or Anonymous."),
    el("li",{},"For Google sign-in, add the domain you open this from (e.g. your GitHub Pages domain, or localhost) under Authentication → Settings → Authorized domains."),
    el("li",{},"Paste these Firestore security rules so only you can read your data:")));
  const pre=el("pre",{style:"margin:10px 0 0;padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre"}); pre.textContent=RULES;
  det.append(pre,
    el("div",{class:"hint",style:"margin-top:10px"},"Note: Google sign-in needs an authorized domain, so it won't work from a raw file:// path — host the page (GitHub Pages / localhost) or use Anonymous. This preview inside Claude runs local-only; the copy in your repo does the cloud sync."));
  p.append(det);
  return p;
}

/* boot */
state=load();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(!state.settings.theme)render(); });
render();
if(state.settings.firebase && state.settings.firebase.config && state.settings.firebase.autoconnect!==false){ Cloud.connect(); }
})();
</script>
