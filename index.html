<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterr — Command Ledger</title>
<meta name="description" content="A highly customizable command ledger for an MBA life: subjects, case competitions, mentorship, committees and admin — every deadline in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================= TOKENS */
:root{
  /* Light — "Daylight": cool porcelain, not AI cream */
  --ground:#F4F5F2; --panel:#FCFCFA; --panel-2:#F0F1EC; --raise:#FFFFFF;
  --line:#E2E3DC; --line-strong:#CFD1C7;
  --ink:#1E2027; --ink-2:#4A4D57; --ink-dim:#767A84; --ink-faint:#A2A6AE;
  --accent:#C98A2E; --accent-ink:#7A5312; --accent-wash:#F4E7CE;
  --good:#4E9578; --good-wash:#DCEBE3;
  --crit:#C0574A; --crit-wash:#F3DED9;
  --shadow:0 1px 2px rgba(24,26,32,.04), 0 8px 28px -12px rgba(24,26,32,.16);
  --shadow-lift:0 2px 6px rgba(24,26,32,.06), 0 22px 50px -18px rgba(24,26,32,.30);
  --radius:10px; --radius-lg:16px;
  --sans:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --serif:"Instrument Serif", ui-serif, Georgia, serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root:not([data-theme="light"]){ /* system-dark */ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131419; --panel:#1A1C23; --panel-2:#20232B; --raise:#242832;
    --line:#2C2F3A; --line-strong:#3A3E4B;
    --ink:#E9E7DF; --ink-2:#BFC1CB; --ink-dim:#8A8D99; --ink-faint:#5C5F6C;
    --accent:#E8A33D; --accent-ink:#F0C179; --accent-wash:#332813;
    --good:#66BF9C; --good-wash:#16281F;
    --crit:#DB7B6D; --crit-wash:#2E1A17;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 26px 60px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#131419; --panel:#1A1C23; --panel-2:#20232B; --raise:#242832;
  --line:#2C2F3A; --line-strong:#3A3E4B;
  --ink:#E9E7DF; --ink-2:#BFC1CB; --ink-dim:#8A8D99; --ink-faint:#5C5F6C;
  --accent:#E8A33D; --accent-ink:#F0C179; --accent-wash:#332813;
  --good:#66BF9C; --good-wash:#16281F;
  --crit:#DB7B6D; --crit-wash:#2E1A17;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 26px 60px -20px rgba(0,0,0,.75);
}

/* ============================================================= BASE */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
a{color:inherit}
svg{width:16px; height:16px}
::selection{background:var(--accent-wash); color:var(--ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
input,textarea,select{
  background:var(--panel); border:1px solid var(--line-strong); color:var(--ink);
  border-radius:8px; padding:8px 10px; width:100%;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent)}
textarea{resize:vertical; min-height:70px; line-height:1.55}
label.fl{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-dim); margin:0 0 6px 1px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================= LAYOUT */
.app{display:grid; grid-template-columns:250px 1fr; height:100vh; overflow:hidden}
.spine{
  background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.brand{padding:22px 22px 16px; border-bottom:1px solid var(--line)}
.brand h1{
  font-family:var(--serif); font-weight:400; font-size:34px; line-height:.9;
  margin:0; letter-spacing:-.01em;
}
.brand h1 .dot{color:var(--accent)}
.brand .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:8px;
}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav .navlbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint); padding:10px 12px 6px}
.navitem{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px;
  color:var(--ink-2); font-weight:500; font-size:14px; text-align:left; width:100%;
  transition:background .15s, color .15s;
}
.navitem svg{width:17px; height:17px; opacity:.85; flex:none}
.navitem .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
.navitem:hover{background:var(--panel-2); color:var(--ink)}
.navitem.on{background:var(--accent-wash); color:var(--ink)}
.navitem.on svg{opacity:1}
.spine .cats{padding:4px 12px 12px; overflow-y:auto; flex:1; min-height:0}
.catrow{display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:9px;
  width:100%; text-align:left; color:var(--ink-2); font-size:13.5px; font-weight:500}
.catrow:hover{background:var(--panel-2); color:var(--ink)}
.catrow.on{background:var(--panel-2); color:var(--ink)}
.swatch{width:10px; height:10px; border-radius:3px; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.catrow .cnt{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
.spine .foot{padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center}

/* main */
.main{display:flex; flex-direction:column; min-width:0; min-height:0}
.topbar{
  display:flex; align-items:center; gap:14px; padding:16px 26px;
  border-bottom:1px solid var(--line); background:var(--ground);
}
.topbar .vtitle{font-family:var(--serif); font-size:27px; line-height:1; letter-spacing:-.01em}
.topbar .vsub{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:5px}
.search{position:relative; margin-left:auto; width:min(300px,34vw)}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint)}
.search input{padding-left:33px; background:var(--panel); border-radius:999px}
.canvas{flex:1; overflow-y:auto; padding:26px; min-height:0}
.canvas.pad0{padding:0}

/* ============================================================= BUTTONS */
.btn{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:9px;
  font-weight:600; font-size:14px; border:1px solid var(--line-strong); background:var(--panel);
  color:var(--ink); transition:.15s}
.btn:hover{border-color:var(--ink-faint)}
.btn svg{width:16px; height:16px}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#211603}
.btn.pri:hover{filter:brightness(1.05)}
:root[data-theme="light"] .btn.pri, :root:not([data-theme="dark"]) .btn.pri{color:#2A1B04}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2); color:var(--ink)}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:8px}
.iconbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:9px;
  border:1px solid var(--line-strong); background:var(--panel); color:var(--ink-2)}
.iconbtn:hover{color:var(--ink); border-color:var(--ink-faint)}
.iconbtn svg{width:17px; height:17px}

/* ============================================================= CHIPS / PILLS */
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; font-weight:500;
  border:1px solid var(--line-strong); color:var(--ink-2); white-space:nowrap}
.pill .swatch{width:7px; height:7px}
.pill.due{color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 45%, transparent); background:var(--accent-wash)}
.pill.over{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 45%, transparent); background:var(--crit-wash)}
.pill.done{color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, transparent); background:var(--good-wash)}
.tag{display:inline-block; padding:2px 8px; border-radius:6px; background:var(--panel-2);
  color:var(--ink-dim); font-size:11.5px; font-weight:500}
.prio{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600}
.prio.p-Critical{color:var(--crit)} .prio.p-High{color:var(--accent-ink)}
.prio.p-Medium{color:var(--ink-2)} .prio.p-Low{color:var(--ink-faint)}

/* ============================================================= OVERVIEW */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:18px 18px 16px; position:relative; overflow:hidden}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim)}
.stat .v{font-family:var(--serif); font-size:52px; line-height:.85; margin-top:14px; letter-spacing:-.02em}
.stat .sub{font-size:12px; color:var(--ink-faint); margin-top:6px}
.stat.alert .v{color:var(--crit)} .stat.warn .v{color:var(--accent)}
.stat.ok .v{color:var(--good)}
.ov-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:24px; align-items:start}
.sec-h{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
.sec-h h2{font-family:var(--serif); font-size:24px; font-weight:400; margin:0; letter-spacing:-.01em}
.sec-h .meta{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint)}

/* timeline */
.bucket{margin-bottom:20px}
.bucket .bh{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim); display:flex; align-items:center; gap:10px; margin-bottom:9px}
.bucket .bh .ln{flex:1; height:1px; background:var(--line)}
.bucket.overdue .bh{color:var(--crit)}
.dl{display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:11px;
  border:1px solid var(--line); background:var(--panel); margin-bottom:8px; text-align:left; width:100%;
  transition:.14s}
.dl:hover{border-color:var(--ink-faint); box-shadow:var(--shadow); transform:translateY(-1px)}
.dl .when{font-family:var(--mono); font-size:12px; width:64px; flex:none; color:var(--ink-2); text-align:right}
.dl.over .when{color:var(--crit)}
.dl .body{min-width:0; flex:1}
.dl .t{font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dl .m{font-size:12px; color:var(--ink-dim); margin-top:2px; display:flex; align-items:center; gap:8px}
.dl .m .kind{color:var(--ink-faint)}
.dl.is-done .t{text-decoration:line-through; color:var(--ink-dim)}

/* attention card */
.att{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:6px}
.att .att-h{padding:14px 14px 10px; display:flex; align-items:center; gap:9px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim)}
.progwrap{padding:14px 16px 18px}
.prog-lbl{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim); margin-bottom:8px}
.prog-lbl b{color:var(--ink); font-weight:600}
.track{height:9px; border-radius:99px; background:var(--panel-2); overflow:hidden}
.track > i{display:block; height:100%; background:var(--good); border-radius:99px; transition:width .5s}
.catbars{display:flex; flex-direction:column; gap:11px; margin-top:16px}
.cb{display:grid; grid-template-columns:96px 1fr 40px; align-items:center; gap:10px}
.cb .nm{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:flex; align-items:center; gap:7px}
.cb .mini{height:7px; border-radius:99px; background:var(--panel-2); overflow:hidden}
.cb .mini > i{display:block; height:100%; border-radius:99px}
.cb .n{font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:right}

/* ============================================================= BOARD */
.boardbar{display:flex; align-items:center; gap:10px; margin-bottom:18px}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden; background:var(--panel)}
.seg button{padding:7px 13px; font-size:13px; font-weight:600; color:var(--ink-dim)}
.seg button.on{background:var(--panel-2); color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.board{display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding-bottom:14px}
.col{flex:0 0 300px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:12px; min-height:120px}
.col.dragover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.col .colh{display:flex; align-items:center; gap:9px; padding:4px 6px 12px}
.col .colh .swatch{width:9px; height:9px}
.col .colh .nm{font-weight:700; font-size:13.5px}
.col .colh .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
.card{background:var(--raise); border:1px solid var(--line); border-radius:12px; padding:13px;
  margin-bottom:10px; cursor:grab; transition:.14s; box-shadow:var(--shadow)}
.card:hover{border-color:var(--ink-faint); transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.card.dragging{opacity:.45}
.card .ct{font-weight:600; font-size:14.5px; line-height:1.3}
.card.is-done .ct{text-decoration:line-through; color:var(--ink-dim)}
.card .cmeta{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center}
.card .cfoot{display:flex; align-items:center; gap:10px; margin-top:11px; color:var(--ink-faint); font-size:11.5px}
.card .cfoot .g{display:flex; align-items:center; gap:4px}
.card .cfoot svg{width:13px; height:13px}
.avstack{display:flex}
.av{width:20px; height:20px; border-radius:99px; display:grid; place-items:center; font-size:9px; font-weight:700;
  font-family:var(--mono); border:1.5px solid var(--panel); margin-left:-6px; color:#20120a}
.av:first-child{margin-left:0}

/* ============================================================= LIST */
.tablewrap{border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; background:var(--panel)}
table{width:100%; border-collapse:collapse}
thead th{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); text-align:left; padding:12px 14px; border-bottom:1px solid var(--line);
  cursor:pointer; user-select:none; white-space:nowrap}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.5; margin-left:3px}
tbody td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer; transition:background .12s}
tbody tr:hover{background:var(--panel-2)}
td .t{font-weight:600}
tr.is-done td .t{text-decoration:line-through; color:var(--ink-dim)}
.chk{width:19px; height:19px; border-radius:6px; border:1.6px solid var(--line-strong); display:grid;
  place-items:center; flex:none; transition:.12s}
.chk:hover{border-color:var(--good)}
.chk.on{background:var(--good); border-color:var(--good)}
.chk svg{width:12px; height:12px; color:#fff; opacity:0}
.chk.on svg{opacity:1}
:root[data-theme="dark"] .chk.on svg, :root:not([data-theme="light"]) .chk.on svg{color:#0c1a13}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chk.on svg{color:#fff}}

/* ============================================================= CALENDAR */
.calhead{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.calhead .m{font-family:var(--serif); font-size:26px; letter-spacing:-.01em; min-width:210px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
.cal .dow{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); text-align:center; padding-bottom:4px}
.day{min-height:96px; border:1px solid var(--line); border-radius:11px; background:var(--panel);
  padding:8px; display:flex; flex-direction:column; gap:5px; transition:.14s; text-align:left}
.day.pad{background:transparent; border-color:transparent}
.day:not(.pad){cursor:pointer}
.day:not(.pad):hover{border-color:var(--ink-faint)}
.day.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.day .dn{font-family:var(--mono); font-size:12px; color:var(--ink-2); font-weight:600}
.day.today .dn{color:var(--accent-ink)}
.day .ev{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.day .ev .swatch{width:6px; height:6px; flex:none}
.day .ev.done{color:var(--ink-faint); text-decoration:line-through}
.day .more{font-family:var(--mono); font-size:10px; color:var(--ink-faint)}
.daydetail{margin-top:22px}

/* ============================================================= SETTINGS */
.settings{max-width:760px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:20px 22px; margin-bottom:20px}
.panel h3{font-family:var(--serif); font-weight:400; font-size:22px; margin:0 0 4px; letter-spacing:-.01em}
.panel .desc{font-size:13px; color:var(--ink-dim); margin:0 0 18px}
.editline{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.editline:last-of-type{border-bottom:none}
.editline input[type=text]{max-width:230px}
.editline .grow{flex:1}
.editline input[type=color]{width:38px; height:34px; padding:2px; border-radius:8px; cursor:pointer}
.accents{display:flex; gap:10px; flex-wrap:wrap}
.accents button{width:34px; height:34px; border-radius:9px; border:2px solid transparent; transition:.12s}
.accents button.on{border-color:var(--ink); transform:scale(1.08)}
.themeseg{margin-top:4px}

/* ============================================================= MODAL / EDITOR */
.scrim{position:fixed; inset:0; background:rgba(10,11,15,.55); backdrop-filter:blur(3px);
  display:flex; justify-content:flex-end; z-index:60; opacity:0; animation:fade .18s forwards}
@keyframes fade{to{opacity:1}}
.drawer{width:min(560px,100%); background:var(--ground); height:100%; overflow-y:auto;
  border-left:1px solid var(--line); box-shadow:var(--shadow-lift); transform:translateX(24px);
  animation:slidein .22s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes slidein{to{transform:translateX(0)}}
.drawer .dh{position:sticky; top:0; background:var(--ground); z-index:2; display:flex; align-items:center;
  gap:12px; padding:18px 22px; border-bottom:1px solid var(--line)}
.drawer .dh .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint)}
.drawer .db{padding:22px}
.field{margin-bottom:18px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.title-input{font-family:var(--serif); font-size:26px; border:none; background:none; padding:6px 2px;
  border-bottom:1px solid var(--line); border-radius:0; letter-spacing:-.01em}
.title-input:focus{border-color:var(--accent)}
.miniadd{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; padding:6px 2px}
.miniadd:hover{color:var(--accent-ink)}
.miniadd svg{width:14px; height:14px}
.subrow{display:flex; align-items:center; gap:9px; padding:8px; border:1px solid var(--line);
  border-radius:10px; margin-bottom:8px; background:var(--panel)}
.subrow input[type=text]{border:none; background:none; padding:2px 4px}
.subrow input.dt{max-width:140px; border:none; background:none; font-family:var(--mono); font-size:12px; color:var(--ink-dim)}
.subrow .rm{color:var(--ink-faint); width:24px; height:24px; display:grid; place-items:center; border-radius:6px; flex:none}
.subrow .rm:hover{color:var(--crit); background:var(--crit-wash)}
.subrow .chk{width:18px; height:18px}
.cf-row{display:grid; grid-template-columns:1fr 120px 1fr auto; gap:8px; align-items:center; margin-bottom:8px}
.cf-row input, .cf-row select{padding:7px 9px; font-size:13px}
.people-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px}
.dfoot{position:sticky; bottom:0; background:var(--ground); border-top:1px solid var(--line);
  padding:14px 22px; display:flex; gap:10px; align-items:center}
.dfoot .del{margin-left:auto; color:var(--crit)}
.dfoot .del:hover{background:var(--crit-wash)}

/* ============================================================= MISC */
.empty{text-align:center; padding:70px 20px; color:var(--ink-dim)}
.empty .big{font-family:var(--serif); font-size:30px; color:var(--ink-2); margin-bottom:6px}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:10px; font-size:13.5px;
  font-weight:500; box-shadow:var(--shadow-lift); opacity:0; transition:.25s; z-index:80; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.mobnav{display:none}
.hint{font-size:12px; color:var(--ink-faint); margin-top:8px}
select.statussel{max-width:190px}

/* ============================================================= RESPONSIVE */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .spine{display:none}
  .mobnav{display:flex; gap:6px; overflow-x:auto; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel)}
  .mobnav .navitem{width:auto; white-space:nowrap; padding:8px 12px}
  .ov-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .canvas{padding:18px}
  .topbar{padding:14px 18px}
  .search{width:auto; flex:1}
  .cf-row{grid-template-columns:1fr 1fr; }
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}

<script>
/* =====================================================================
   MASTERR — command ledger.  Vanilla JS, single file, localStorage.
   ===================================================================== */
(function(){
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k];
    else if(k.startsWith("on")&&typeof a[k]==="function")n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!=null&&a[k]!==false)n.setAttribute(k,a[k]); }
  for(const c of kids.flat()){ if(c==null||c===false)continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* -------- icons (inline, line-style) -------- */
const I={
 overview:'<path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/>',
 board:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="14" rx="1"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 6.6 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.6a1.6 1.6 0 0 0-1.5-1H1a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 3 6.6a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 8 3V2.5a2 2 0 0 1 4 0v.2A1.6 1.6 0 0 0 15 3.9a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',

 check:'<path d="M20 6 9 17l-5-5"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
 chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 18l6-6-6-6"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
 flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V4"/>',
 dot:'<circle cx="12" cy="12" r="4"/>',
};
const svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round">${I[k]||''}</svg>`;
const icon=(k,w)=>{const s=document.createElement('span'); s.style.display='inline-flex'; s.innerHTML=svg(k,w); return s.firstChild;};

/* -------- date helpers -------- */
const MS=86400000;
function today(){const d=new Date(); d.setHours(0,0,0,0); return d;}
function parse(iso){ if(!iso)return null; const p=String(iso).split('-').map(Number); if(p.length<3)return null; const d=new Date(p[0],p[1]-1,p[2]); return isNaN(d)?null:d;}
function toISO(d){ if(!d)return ""; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(iso){ const p=parse(iso); if(!p)return null; return Math.round((p-today())/MS);}
function fmtShort(iso){ const p=parse(iso); return p?p.toLocaleDateString(undefined,{month:'short',day:'numeric'}):"";}
function relLabel(iso){ const d=daysUntil(iso); if(d==null)return "—";
  if(d<0)return Math.abs(d)+"d ago"; if(d===0)return "Today"; if(d===1)return "Tomorrow";
  const p=parse(iso); if(d<7)return p.toLocaleDateString(undefined,{weekday:'short'}); return fmtShort(iso);}
function bucketOf(d){ if(d<0)return"overdue"; if(d===0)return"today"; if(d===1)return"tomorrow";
  if(d<=7)return"week"; if(d<=14)return"next"; return"later";}
const BUCKETS=[["overdue","Overdue"],["today","Today"],["tomorrow","Tomorrow"],["week","This week"],["next","Next week"],["later","Later"]];

/* =====================================================================
   STATE
   ===================================================================== */
const KEY="masterr.v1";
const DEFAULT_STATUSES=[
  {id:"todo",name:"Not started",color:"#8A8D99",done:false},
  {id:"prog",name:"In progress",color:"#5B8BB0",done:false},
  {id:"block",name:"Blocked",color:"#C0574A",done:false},
  {id:"done",name:"Done",color:"#4E9578",done:true},
];
const PRIOS=["Low","Medium","High","Critical"];
const CFTYPES=["text","number","date","url","select"];
let state, view="overview", catFilter="all", query="", boardGroup="status",
    sortKey="due", sortDir=1, calRef=today(), selDay=null;

function seed(){
  const t=today(); const plus=n=>toISO(new Date(t.getTime()+n*MS));
  const cats=[
    {id:"acad",name:"Academics",color:"#5B8BB0"},
    {id:"case",name:"Case Comps",color:"#E8A33D"},
    {id:"ment",name:"Mentorship",color:"#66BF9C"},
    {id:"club",name:"Clubs & Committees",color:"#A98BB0"},
    {id:"admin",name:"Admin",color:"#94A0AE"},
    {id:"pers",name:"Personal",color:"#CC8A6A"},
  ];
  const mk=o=>Object.assign({id:uid(),statusId:"todo",priority:"Medium",notes:"",tags:[],
    people:[],subtasks:[],fields:[],createdAt:Date.now(),updatedAt:Date.now(),archived:false},o);
  const items=[
    mk({title:"Corporate Finance — Group Project",categoryId:"acad",statusId:"prog",priority:"High",due:plus(6),
      tags:["group","report"], notes:"Valuation of a listed FMCG firm. Deck + 15-page report.",
      people:[{name:"Aarav Mehta",role:"Modeling"},{name:"Sara Khan",role:"Research"},{name:"You",role:"Deck + submit"}],
      subtasks:[{id:uid(),title:"Build DCF model",done:true,due:plus(-1)},{id:uid(),title:"Draft report",done:false,due:plus(3)},{id:uid(),title:"Final deck & submit",done:false,due:plus(6)}],
      fields:[{id:uid(),label:"Professor",type:"text",value:"Prof. Rao"},{id:uid(),label:"Weightage",type:"text",value:"30%"}]}),
    mk({title:"Marketing Strategy — Quiz 2",categoryId:"acad",priority:"High",due:plus(2),tags:["quiz"],
      notes:"Chapters 4–7, STP & positioning.",fields:[{id:uid(),label:"Room",type:"text",value:"LH-3"}]}),
    mk({title:"Operations — Assignment 3",categoryId:"acad",statusId:"prog",due:plus(9),tags:["assignment"],
      notes:"Linear programming problem set."}),
    mk({title:"Deloitte Case Championship",categoryId:"case",statusId:"prog",priority:"Critical",due:plus(11),
      tags:["strategy","external"], notes:"National-level, ₹2L prize pool. Track: Go-to-market.",
      people:[{name:"You",role:"Lead"},{name:"Ishita Roy",role:"Finance"},{name:"Karan V.",role:"Design"}],
      subtasks:[{id:uid(),title:"Internal registration",done:true,due:plus(-3)},{id:uid(),title:"External registration",done:false,due:plus(1)},{id:uid(),title:"Round 1 submission",done:false,due:plus(7)},{id:uid(),title:"Assessment / jury call",done:false,due:plus(11)}],
      fields:[{id:uid(),label:"Team name",type:"text",value:"North Star"},{id:uid(),label:"Portal",type:"url",value:"https://unstop.com"},{id:uid(),label:"Prize",type:"text",value:"₹2,00,000"}]}),
    mk({title:"P&G CEO Challenge",categoryId:"case",priority:"High",due:plus(15),tags:["external"],
      notes:"Awaiting problem statement release.",
      people:[{name:"You",role:"—"},{name:"Neha S.",role:"—"}],
      subtasks:[{id:uid(),title:"Registration",done:false,due:plus(4)},{id:uid(),title:"First submission",done:false,due:plus(15)}]}),
    mk({title:"Mentor session — career roadmap",categoryId:"ment",priority:"Medium",due:plus(3),tags:["1:1"],
      notes:"Discuss summer internship targets & consulting vs product.",
      fields:[{id:uid(),label:"Mentor",type:"text",value:"Rohan Kapoor"},{id:uid(),label:"Mode",type:"text",value:"Zoom, 6 PM"}]}),
    mk({title:"Finance Club — speaker event logistics",categoryId:"club",statusId:"prog",due:plus(5),tags:["event"],
      notes:"Book auditorium, confirm speaker travel, promo.",
      subtasks:[{id:uid(),title:"Confirm venue",done:true},{id:uid(),title:"Design poster",done:false,due:plus(2)},{id:uid(),title:"Send invites",done:false,due:plus(4)}]}),
    mk({title:"Placement Committee — company outreach",categoryId:"club",priority:"High",due:plus(8),tags:["placement"],
      notes:"Email 12 target firms for final placements."}),
    mk({title:"Submit semester fee receipt",categoryId:"admin",priority:"High",due:plus(-1),tags:["urgent"],
      notes:"Upload paid receipt to the ERP portal."}),
    mk({title:"Update CV / Resume",categoryId:"pers",statusId:"prog",due:plus(5),tags:["career"],
      notes:"One-pager, consulting format.",
      subtasks:[{id:uid(),title:"Refresh bullet points",done:true},{id:uid(),title:"Review with senior",done:false,due:plus(3)},{id:uid(),title:"Finalize PDF",done:false,due:plus(5)}]}),
  ];
  return {version:1, meta:{title:"Masterr", subtitle:"Command Ledger"},
    categories:cats, statuses:DEFAULT_STATUSES.map(s=>({...s})), items,
    settings:{theme:"", accent:"", firstRun:true}};
}
function load(){ try{const raw=localStorage.getItem(KEY); if(raw){const s=JSON.parse(raw);
    if(s&&s.items)return s;}}catch(e){} return seed(); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function catById(id){return state.categories.find(c=>c.id===id)||{name:"—",color:"#888"};}
function statusById(id){return state.statuses.find(s=>s.id===id)||state.statuses[0];}
function isDone(it){return statusById(it.statusId).done;}

/* =====================================================================
   THEME
   ===================================================================== */
const ACCENTS=[["Marigold","#E8A33D"],["Cerulean","#5B8BB0"],["Sage","#5FA98C"],
  ["Plum","#9C7BB0"],["Clay","#CC8262"],["Rosewood","#C4697A"]];
function applyTheme(){
  const root=document.documentElement;
  if(state.settings.theme==="dark"||state.settings.theme==="light") root.setAttribute("data-theme",state.settings.theme);
  else root.removeAttribute("data-theme");
  const a=state.settings.accent;
  if(a){ root.style.setProperty("--accent",a);
    root.style.setProperty("--accent-wash", hexA(a,.16));
    root.style.setProperty("--accent-ink", a);
  } else { root.style.removeProperty("--accent"); root.style.removeProperty("--accent-wash"); root.style.removeProperty("--accent-ink"); }
}
function hexA(hex,al){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${al})`;}

/* =====================================================================
   RENDER — shell
   ===================================================================== */
const VIEWS=[["overview","Overview","Today at a glance"],["board","Board","Move & track"],
  ["calendar","Calendar","Month view"],["list","List","Everything, sorted"],["settings","Settings","Make it yours"]];

function render(){
  applyTheme();
  const root=$("#root"); root.innerHTML="";
  root.append(el("div",{class:"app"}, spine(), main()));
  if(state.settings.firstRun){ state.settings.firstRun=false; save(); }
}
function counts(){ const m={all:0}; state.categories.forEach(c=>m[c.id]=0);
  state.items.forEach(it=>{ if(it.archived)return; m.all++; if(m[it.categoryId]!=null)m[it.categoryId]++; }); return m; }

function spine(){
  const cn=counts();
  const nav=el("div",{class:"nav"},
    el("div",{class:"navlbl"},"Views"),
    ...VIEWS.map(([k,label])=>{
      const b=el("button",{class:"navitem"+(view===k?" on":""),onclick:()=>{view=k; selDay=null; render();}},
        icon(k), el("span",{},label));
      if(k!=="settings"&&k!=="calendar") b.append(el("span",{class:"cnt"},""));
      return b;
    })
  );
  const cats=el("div",{class:"cats"},
    el("div",{class:"navlbl",style:"padding-left:12px"},"Categories"),
    el("button",{class:"catrow"+(catFilter==="all"?" on":""),onclick:()=>{catFilter="all"; render();}},
      el("span",{class:"swatch",style:"background:var(--ink-faint)"}), el("span",{},"All"),
      el("span",{class:"cnt"},String(cn.all))),
    ...state.categories.map(c=>el("button",{class:"catrow"+(catFilter===c.id?" on":""),onclick:()=>{catFilter=c.id; render();}},
      el("span",{class:"swatch",style:"background:"+c.color}), el("span",{style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},c.name),
      el("span",{class:"cnt"},String(cn[c.id]||0))))
  );
  const foot=el("div",{class:"foot"},
    el("button",{class:"iconbtn",title:"Toggle light / dark",onclick:toggleTheme},
      icon(document.documentElement.getAttribute("data-theme")==="dark"||(matchMedia("(prefers-color-scheme:dark)").matches&&document.documentElement.getAttribute("data-theme")!=="light")?"sun":"moon")),
    el("div",{style:"font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase"},"Saved locally")
  );
  return el("aside",{class:"spine"},
    el("div",{class:"brand"},
      el("h1",{html:'Masterr<span class="dot">.</span>'}),
      el("div",{class:"tag"},state.meta.subtitle||"Command Ledger")),
    nav, cats, foot);
}

function main(){
  const cur=VIEWS.find(v=>v[0]===view)||VIEWS[0];
  const mob=el("div",{class:"mobnav"},
    ...VIEWS.map(([k,label])=>el("button",{class:"navitem"+(view===k?" on":""),onclick:()=>{view=k;selDay=null;render();}}, icon(k), el("span",{},label))));
  const top=el("div",{class:"topbar"},
    el("div",{}, el("div",{class:"vtitle"},cur[1]), el("div",{class:"vsub"},cur[2])),
    (view!=="settings")?el("div",{class:"search"}, icon("search"),
      el("input",{type:"text",placeholder:"Search titles, tags, people…",value:query,
        oninput:e=>{query=e.target.value; rerenderCanvas();}})):null,
    (view!=="settings")?el("button",{class:"btn pri",onclick:()=>openEditor()}, icon("plus"), el("span",{},"New")):null
  );
  const canvas=el("div",{class:"canvas"+(view==="board"?"":""),id:"canvas"});
  canvas.append(viewBody());
  return el("main",{class:"main"}, mob, top, canvas);
}
function rerenderCanvas(){ const c=$("#canvas"); if(!c)return; c.innerHTML=""; c.append(viewBody()); }

function viewBody(){
  switch(view){
    case "overview": return overviewView();
    case "board": return boardView();
    case "calendar": return calendarView();
    case "list": return listView();
    case "settings": return settingsView();
  }
}

/* -------- filtering -------- */
function visibleItems(){
  const q=query.trim().toLowerCase();
  return state.items.filter(it=>{
    if(it.archived)return false;
    if(catFilter!=="all"&&it.categoryId!==catFilter)return false;
    if(q){ const hay=[it.title,(it.tags||[]).join(" "),(it.people||[]).map(p=>p.name).join(" "),it.notes,
      (it.fields||[]).map(f=>f.label+" "+f.value).join(" ")].join(" ").toLowerCase();
      if(!hay.includes(q))return false; }
    return true;
  });
}
/* all deadlines flattened: item due + subtask dues */
function deadlines(items){
  const out=[];
  items.forEach(it=>{
    if(it.due) out.push({iso:it.due, itemId:it.id, title:it.title, kind:"Due", done:isDone(it), catId:it.categoryId});
    (it.subtasks||[]).forEach(s=>{ if(s.due) out.push({iso:s.due, itemId:it.id, title:it.title, kind:s.title, done:s.done||isDone(it), catId:it.categoryId}); });
  });
  out.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
  return out;
}

/* =====================================================================
   OVERVIEW
   ===================================================================== */
function overviewView(){
  const items=visibleItems();
  const dls=deadlines(items).filter(d=>!d.done);
  const overdue=dls.filter(d=>daysUntil(d.iso)<0).length;
  const week=dls.filter(d=>{const n=daysUntil(d.iso); return n>=0&&n<=7;}).length;
  const active=items.filter(it=>!isDone(it)).length;
  const doneCount=items.filter(isDone).length;
  const wrap=el("div",{});
  wrap.append(el("div",{class:"stats"},
    stat(overdue, "Overdue", overdue>0?"alert":"", overdue>0?"needs attention now":"all clear"),
    stat(week, "Due in 7 days", "warn", "upcoming deadlines"),
    stat(active, "Active", "", "not yet done"),
    stat(doneCount, "Completed", "ok", "marked done")
  ));

  /* horizon */
  const grouped={}; BUCKETS.forEach(([k])=>grouped[k]=[]);
  dls.forEach(d=>grouped[bucketOf(daysUntil(d.iso))].push(d));
  const horizon=el("div",{});
  horizon.append(el("div",{class:"sec-h"}, el("h2",{},"On the horizon"),
    el("span",{class:"meta"},dls.length+" open deadline"+(dls.length===1?"":"s"))));
  let any=false;
  BUCKETS.forEach(([k,label])=>{
    const arr=grouped[k]; if(!arr.length)return; any=true;
    const b=el("div",{class:"bucket"+(k==="overdue"?" overdue":"")},
      el("div",{class:"bh"}, el("span",{},label), el("span",{class:"ln"}), el("span",{},String(arr.length))));
    arr.forEach(d=>{
      const c=catById(d.catId); const od=daysUntil(d.iso)<0;
      b.append(el("button",{class:"dl"+(od?" over":""),onclick:()=>openEditor(d.itemId)},
        el("span",{class:"when mono"}, relLabel(d.iso)),
        el("div",{class:"body"},
          el("div",{class:"t"}, d.title),
          el("div",{class:"m"}, el("span",{class:"swatch",style:"background:"+c.color,title:c.name}),
            el("span",{}, c.name), d.kind!=="Due"?el("span",{class:"kind"},"· "+d.kind):null)),
        el("span",{class:"pill "+(od?"over":"due")}, fmtShort(d.iso))
      ));
    });
    horizon.append(b);
  });
  if(!any) horizon.append(el("div",{class:"empty"}, el("div",{class:"big"},"Nothing scheduled"),
    el("div",{},"No open deadlines here. Add one with the New button.")));

  /* progress side */
  const side=el("div",{});
  const total=items.length, done=doneCount;
  const pct=total?Math.round(done/total*100):0;
  side.append(el("div",{class:"att"},
    el("div",{class:"att-h"}, icon("flag",2), el("span",{},"Progress")),
    el("div",{class:"progwrap"},
      el("div",{class:"prog-lbl"}, el("span",{}, el("b",{},done+" of "+total), " tasks complete"),
        el("b",{class:"mono"}, pct+"%")),
      el("div",{class:"track"}, el("i",{style:"width:"+pct+"%"})),
      el("div",{class:"catbars"}, ...state.categories.map(c=>{
        const its=state.items.filter(i=>!i.archived&&i.categoryId===c.id);

function cardEl(it){

  const byDay={};
  deadlines(visibleItems()).forEach(d=>{ (byDay[d.iso]=byDay[d.iso]||[]).push(d); });
  const wrap=el("div",{});
  wrap.append(el("div",{class:"calhead"},

  for(let day=1;day<=dim;day++){
    const iso=toISO(new Date(y,m,day)); const evs=byDay[iso]||[];
    const cell=el("button",{class:"day"+(iso===tIso?" today":""),onclick:()=>{selDay=iso; rerenderCanvas();}},
      el("div",{class:"dn"},String(day)));

    if(evs.length>3)cell.append(el("div",{class:"more"},"+"+(evs.length-3)+" more"));
    grid.append(cell);
  }

    const det=el("div",{class:"daydetail"});
    det.append(el("div",{class:"sec-h"}, el("h2",{}, parse(selDay).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})),

    evs.forEach(d=>{ const c=catById(d.catId); const od=daysUntil(d.iso)<0&&!d.done;
      det.append(el("button",{class:"dl"+(od?" over":"")+(d.done?" is-done":""),onclick:()=>openEditor(d.itemId)},
        el("span",{class:"when mono"}, d.done?"done":relLabel(d.iso)),
        el("div",{class:"body"}, el("div",{class:"t"},d.title),
          el("div",{class:"m"}, el("span",{class:"swatch",style:"background:"+c.color}), c.name,
            d.kind!=="Due"?el("span",{class:"kind"},"· "+d.kind):null)))); });
    wrap.append(det);
  }
  return wrap;

        el("div",{}, el("label",{class:"fl"},"Tags"), tagsInput))),
    el("div",{class:"field"}, el("label",{class:"fl"},"Notes"), notesInput),

    el("div",{class:"field"}, el("label",{class:"fl"},"Sub-tasks & staged deadlines"),
      subWrap, el("button",{class:"miniadd",onclick:()=>{ const s={id:uid(),title:"",done:false,due:""}; it.subtasks.push(s); addSub(s); }}, icon("plus"),"Add sub-task")),

    el("div",{class:"field"}, el("label",{class:"fl"},"Team & people"),
      pplWrap, el("button",{class:"miniadd",onclick:()=>{ const p={name:"",role:""}; it.people.push(p); addPpl(p); }}, icon("plus"),"Add person")),

    el("div",{class:"field"}, el("label",{class:"fl"},"Custom fields — add anything"),
      cfWrap, el("button",{class:"miniadd",onclick:()=>{ const f={id:uid(),label:"",type:"text",value:""}; it.fields.push(f); addCF(f); }}, icon("plus"),"Add field"))
  );

  const saveIt=()=>{
    it.title=titleInput.value.trim()||"Untitled";
    it.categoryId=catSel.value; it.statusId=stSel.value; it.priority=prSel.value;
    it.due=dueInput.value; it.notes=notesInput.value;
    it.tags=tagsInput.value.split(",").map(s=>s.trim()).filter(Boolean);
    it.subtasks=(it.subtasks||[]).filter(s=>s.title.trim());
    it.people=(it.people||[]).filter(p=>p.name.trim());
    it.fields=(it.fields||[]).filter(f=>f.label.trim());
    it.updatedAt=Date.now();
    if(editing){ const i=state.items.findIndex(x=>x.id===editing.id); state.items[i]=it; }
    else state.items.push(it);
    save(); close(); render(); toast(editing?"Saved":"Task added");
  };

  const foot=el("div",{class:"dfoot"},
    el("button",{class:"btn pri",onclick:saveIt}, icon("check"), editing?"Save changes":"Add task"),
    el("button",{class:"btn ghost",onclick:close},"Cancel"),
    editing?el("button",{class:"btn ghost del",onclick:()=>{ if(confirm("Delete this task?"))
      { state.items=state.items.filter(x=>x.id!==editing.id); save(); close(); render(); toast("Deleted"); } }}, icon("trash"),"Delete"):null
  );

  const drawer=el("div",{class:"drawer"},
    el("div",{class:"dh"},
      el("div",{}, el("div",{class:"eyebrow"}, editing?"Editing task":"New task"),
        el("div",{style:"font-family:var(--serif);font-size:20px"}, editing?"Details":"Add to ledger")),
      el("button",{class:"iconbtn",style:"margin-left:auto",onclick:close}, icon("x"))),
    body, foot);
  const scrim=el("div",{class:"scrim",onclick:e=>{ if(e.target===scrim)close(); }}, drawer);
  m.append(scrim);
  setTimeout(()=>titleInput.focus(),60);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function toggleDone(it){
  const doneStatus=state.statuses.find(s=>s.done);
  if(isDone(it)){ const open=state.statuses.find(s=>!s.done); it.statusId=open?open.id:it.statusId; }
  else if(doneStatus){ it.statusId=doneStatus.id; }
  it.updatedAt=Date.now(); save(); rerenderCanvas();
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark"
    || (matchMedia("(prefers-color-scheme:dark)").matches && document.documentElement.getAttribute("data-theme")!=="light");
  state.settings.theme = isDark ? "light" : "dark"; save(); render();
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900); }
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=el("a",{href:url,download:"masterr-backup-"+toISO(today())+".json"});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
}
function importData(){
  const inp=el("input",{type:"file",accept:"application/json,.json"});
  inp.addEventListener("change",()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result);
      if(!s||!Array.isArray(s.items))throw 0;
      state=Object.assign(seed(),s); catFilter="all"; save(); render(); toast("Imported "+s.items.length+" tasks");
    }catch(e){ toast("Couldn't read that file"); } };
    r.readAsText(f); });
  inp.click();
}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ const m=$("#modal"); if(m.innerHTML){m.innerHTML=""; return;} }
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); openEditor(); }
  if(e.key==="/"){ e.preventDefault(); const s=$(".search input"); s&&s.focus(); }
});

/* boot */
state=load();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(!state.settings.theme)render(); });
render();
})();
</script>
</body>
</html>
